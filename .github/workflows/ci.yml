name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  julia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1"
      - name: Test
        run: julia --project=. -e 'using Pkg; Pkg.test()'
